<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGNI-DRISHTI | National Forest Intelligence Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0f0a;
            color: #ff5c1a;
            font-family: 'Exo 2', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: -0.05em;
            text-shadow: 0 0 30px rgba(255, 92, 26, 0.4);
            text-transform: uppercase;
        }

        .sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 0.6em;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            margin: 40px auto;
            position: relative;
            overflow: hidden;
        }

        .loading-bar::after {
            content: "";
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #ff5c1a;
            animation: load 2s infinite ease-in-out;
        }

        @keyframes load {
            0% { left: -100%; }
            50% { left: 0; }
            100% { left: 100%; }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.2;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="container">
        <h1>AGNI-DRISHTI</h1>
        <div class="sub">National Forest Intelligence Grid</div>
        <div class="loading-bar"></div>
        <div style="font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 0.3em;">TACTICAL BOOT SEQUENCE INITIATED</div>
    </div>
</body>
</html>
</body>
</html>
